name = "pythagorean_paper"
version = "0.1.0"
defaultTargets = ["PythagoreanPaper"]
# The files of this package are classic (non-`module`) Lean files, while Mathlib sets
# `requiresModuleSystem`. Without this key Lake warns when they import Mathlib, and that
# warning fails `lake build --wfail`. This declares the mix as intentional.
allowNonModules = true

[[lean_lib]]
name = "PythagoreanPaper"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"
